<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reset password | NICHERZ</title>
    <link rel="stylesheet" href="style-shop.css" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="toast.css" />
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/jpeg" href="./Images/logo.webp" />
    <link rel="stylesheet" href="ui-ux-overrides.css">

</head>

<body>
    <div class="smoke-background" aria-hidden="true">
        <div class="smoke smoke-one"></div>
        <div class="smoke smoke-two"></div>
        <div class="smoke smoke-three"></div>
    </div>
    <header class="shop-header">
        <div class="shop-header-inner"><a class="brand-wrap auth-brand" href="/" aria-label="NICHERZ home">
                <div class="brand-mark"><img src="./Images/logo.webp" alt="NICHERZ logo" /></div>
                <div class="brand-copy"><span class="brand-name">NICHERZ</span><small>ARCHIVE</small></div>
            </a>
            <!-- <nav class="header-nav" aria-label="Main navigation"><a href="/">HOME</a><a href="/shop">SHOP</a><a
                    href="/#gallery">GALLERY</a><a href="/account">ACCOUNT</a><a href="/login" class="active-nav"
                    aria-current="page">LOGIN</a></nav>
            <div class="header-actions"><a href="/cart" class="cart-pill">CART <span id="cartHeaderCount">(0)</span></a>
            </div> -->
        </div>
    </header>
    <main class="auth-page">
        <section class="auth-card">
            <p class="auth-kicker">NICHERZ </p>
            <h1>WELCOME BACK</h1>
            <p class="auth-subtitle">Enter the archive.</p>
            <form id="resetPasswordForm" class="auth-form"><label for="email">New password</label><input id="password"
                    name="password" type="password" autocomplete="email" required placeholder="••••••••" /><label
                    for="password">Confirm password</label><input id="confirmPassword" name="password" type="password"
                    autocomplete="current-password" required placeholder="••••••••" /><button id="resetBtn"
                    type="submit" class="auth-submit">Update password</button></form>
            <p id="message"></p>
        </section>
    </main>
    <footer class="shop-footer auth-footer">
        <div class="footer-grid">
            <div class="footer-brand"><span class="footer-logo">N</span>
                <div>
                    <h3>NICHERZ</h3>
                    <p>Curated chaos for the loudest souls.</p>
                </div>
            </div>
            <div class="footer-links">
                <h4>INFO</h4><a href="/contact">Contact</a><a href="#">Shipping</a><a href="#">Support</a>
            </div>
            <div class="footer-links">
                <h4>FOLLOW</h4><a href="https://instagram.com/nicherzz" target="_blank"
                    rel="noopener noreferrer">Instagram</a><a href="https://t.me/nicherz" target="_blank"
                    rel="noopener noreferrer">Telegram</a>
            </div>
        </div>
        <div class="footer-bottom"><span>© 2026 NICHERZ</span><span>WEAR THE LEGEND</span></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="reset-password.js"></script>
</body>

</html>
