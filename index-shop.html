<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop | NICHERZ</title>
  <link rel="stylesheet" href="style-shop.css" />
  <link rel="stylesheet" href="toast.css" />
  <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/jpeg" href="./Images/logo.webp" />
  <link rel="stylesheet" href="auth.css">
  <style>
    @media (max-width: 700px) {
      .shop-header-inner { width:94%; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto; align-items:center; column-gap:.8em; row-gap:.7em; }
      .brand-wrap { grid-column:1; grid-row:1; justify-self:start; min-width:0; }
      .header-actions { grid-column:2; grid-row:1; justify-self:end; }
      .header-nav { grid-column:1/-1; grid-row:2; width:100%; min-width:0; justify-content:center; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
      .header-nav::-webkit-scrollbar { display:none; }
    }
  </style>
</head>
<body>
  <div class="smoke-background" aria-hidden="true"><div class="smoke smoke-one"></div><div class="smoke smoke-two"></div><div class="smoke smoke-three"></div></div>
  <header class="shop-header">
    <div class="shop-header-inner">
      <a href="/" class="brand-wrap" aria-label="Brand logo"><div class="brand-mark"><img src="./Images/logo.webp" alt="NICHERZ logo" /></div><div class="brand-copy"><span class="brand-name">NICHERZ</span><small>ARCHIVE</small></div></a>
      <nav class="header-nav" aria-label="Main navigation">
        <a href="/">HOME</a><a href="/shop" class="active-nav" aria-current="page">SHOP</a><a href="/#gallery">BANDS</a><a href="#" class="disabled">APPAREL</a><a href="/contact">CONTACT</a><div id="auth-nav" class="auth-nav"></div>
      </nav>
      <div class="header-actions"><a href="/cart" class="cart-pill" aria-label="Shopping cart">CART <span id="cartHeaderCount">(0)</span></a></div>
    </div>
  </header>
  <main class="shop-page">
    <section class="shop-hero"><h1 class="shop-title">THE ARCHIVE</h1><p class="shop-subtitle">Wear The Legend</p></section>
    <section class="products-section">
      <nav class="shop-categories" aria-label="Product categories">
        <button type="button" class="category-btn active" data-category="all">ALL</button><button type="button" class="category-btn" data-category="band-merch">BAND MERCH</button><button type="button" class="category-btn" data-category="streetwear">STREETWEAR</button><button type="button" class="category-btn" data-category="accessories">ACCESSORIES</button><button type="button" class="category-btn" data-category="y2k">Y2K</button><button type="button" class="category-btn" data-category="music">MUSIC</button><button type="button" class="category-btn" data-category="collectibles">COLLECTIBLES</button><button type="button" class="category-btn" data-category="necklaces">NECKLACES</button><button type="button" class="category-btn" data-category="pendants">PENDANTS</button><button type="button" class="category-btn" data-category="rings">RINGS</button><button type="button" class="category-btn" data-category="albums">Albums</button>
      </nav>
      <div class="products-container" id="products-container"></div>
    </section>
  </main>
  <footer class="shop-footer"><div class="footer-grid"><div class="footer-brand"><span class="footer-logo">N</span><div><h3>NICHERZ</h3><p>Curated chaos for the loudest souls.</p></div></div><div class="footer-links"><h4>SHOP</h4><a href="/shop?category=band-merch">Band Merch</a><a href="/shop?category=streetwear">Streetwear</a><a href="/shop?category=accessories">Accessories</a></div><div class="footer-links"><h4>INFO</h4><a href="/contact">About</a><a href="#">Shipping</a><a href="#">Support</a></div><div class="footer-links"><h4>FOLLOW</h4><a href="https://instagram.com/nicherzz" target="_blank" rel="noopener noreferrer">Instagram</a><a href="https://t.me/nicherz" target="_blank" rel="noopener noreferrer">Telegram</a></div></div><div class="footer-bottom"><span>© 2026 NICHERZ</span><span>WEAR THE LEGEND</span></div></footer>
  <script src="toast.js"></script><script type="module" src="shop.js"></script><script type="module" src="header-auth.js"></script>
  <script>window.setTimeout(() => { const category = new URLSearchParams(window.location.search).get("category"); if (!category || category === "all") return; const button = document.querySelector(`.category-btn[data-category="${CSS.escape(category)}"]`); if (button) button.click(); }, 0);</script>
</body>
</html>
